[platformio]
default_envs = heartrate
src_dir = src

[env]
platform = espressif32@6.4.0
framework = arduino
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
lib_deps =
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.2.1
  h2zero/NimBLE-Arduino@^1.4.3
build_flags =
  -DFW_VERSION=\"0.2.16\"
  -DHUB_HOST_DEFAULT=\"192.168.178.113\"
  -DHUB_PORT_DEFAULT=8093
  -DCORE_DEBUG_LEVEL=0
  -I include
  -I src

[env:heartrate]
board = wemos_d1_mini32
board_build.partitions = min_spiffs.csv
build_flags =
  ${env.build_flags}
  -DHR_BOARD_MINI=1
  -DHR_HISTORY_SIZE=300
  -DHR_RR_HISTORY_SIZE=600
  -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
  -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  -DCONFIG_NIMBLE_CPP_DEBUG_ASSERT_ENABLED=0

[env:heartrate-s3]
board = esp32-s3-devkitc-1
board_build.partitions = min_spiffs.csv
build_flags =
  ${env.build_flags}
  -DHR_BOARD_S3=1
  -DHR_HISTORY_SIZE=360
  -DHR_RR_HISTORY_SIZE=720
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
  -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  -DCONFIG_NIMBLE_CPP_DEBUG_ASSERT_ENABLED=0
